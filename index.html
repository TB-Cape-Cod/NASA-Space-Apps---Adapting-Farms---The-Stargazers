<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <section id="input-view">
    <header>
        <div id="Main_Title">Greener Farms</div>
    </header>
    <form id="User_Information">
        <div id="SearchBar">
            <input type="text" id="location-input" name="fname" placeholder="City or Zip Code">
            <button id="location-search-btn" type="button">
                Search Location
            </button>
            <p id="location-error" style="color: red;"></p>
        </div>
        <div id="World_Map" style="margin-top: 20px;">
            <div id="map" style="height: 290px; width: 100%; border-radius: 20px;"></div>
        </div>
        <div id="Information_Container">

            <div id="Conditions">
                <p id="conditions_label">Manual Input:</p>
                <div class="option_specification">
                    <label for="temperature" class="option_label">Select the average temperature:</label>
                    <select id="temperature" name="temperature" class="dropdowns">
                        <option value="Hot">Hot</option>
                        <option value="Warm">Warm</option>
                        <option value="Cool">Cool</option>
                        <option value="Cold">Cold</option>
                    </select>
                </div>
                <div class="option_specification">
                    <label for="humidity" class="option_label">Select the average humidity:</label>
                    <select id="humidity" name="humidity" class="dropdowns">
                        <option value="Very Humid">Very Humid</option>
                        <option value="Somewhat Humid">Somewhat Humid</option>
                        <option value="Somewhat Dry">Somewhat Dry</option>
                        <option value="Very Dry">Very Dry</option>
                    </select>
                </div>
            </div>
        </div>
    </form>
    <div id="ButtonLeeway">
        <button id="changer">Submit Location</button>
    </div>
    </section>

    <section id="output-view" class="view hidden">
        <div class="output-header">
            <span class="crop-badge">Recommended Strategy</span>
            <h2 id="output-crop-title">[ Main Crop Title Placeholder ]</h2>
        </div>

    <!-- Image Placeholder Section -->
        <div class="output-image-placeholder">
            <span>[ Image Placeholder: Crop / Farm Diagram ]</span>
        </div>

    <!-- Explanation Section -->
        <div class="output-body">
            <h3>Why this works for your farm</h3>
            <p id="output-explanation">[ Detailed strategy explanation and agronomic breakdown will go here... ]</p>
        </div>

        <button id="back-btn" class="btn-secondary">← Back to Inputs</button>
    </section>
    <!--DONT TOUCH THE BELOW CODE-->
    <!-- Load Google Maps API with a callback function named 'initMap' -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCCQZebFpdD52tZ1MyZwfYjk2w7jrlv0wA&callback=initMap"></script>
    <script src="index.js"></script>

    
</body>
</html>
