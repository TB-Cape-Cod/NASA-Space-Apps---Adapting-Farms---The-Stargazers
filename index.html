<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <div id="Main_Title">Greener Farms</div>
    </header>
    <form id="User_Information">
        <div id="SearchBar">
            <input type="text" id="written_location" name="fname" placeholder="City or Zip Code">
        </div>

        <div id="Information_Container">
            <div id="World_Map">PLACEHOLDER- WE WILL AI TS LATER</div>
            <div id="Conditions">
                <p id="conditions_label">Manual Input:</p>
                <div class="option_specification">
                    <label for="temperature" class="option_label">Select the average temperature:</label>
                    <select id="temperature" name="temperature" class="dropdowns">
                        <option value="Hot">Hot</option>
                        <option value="Warm">Warm</option>
                        <option value="Cool">Cool</option>
                        <option value="Cold">Cold</option>
                    </select>
                </div>
                <div class="option_specification">
                    <label for="humidity" class="option_label">Select the average humidity:</label>
                    <select id="humidity" name="humidity" class="dropdowns">
                        <option value="Very Humid">Very Humid</option>
                        <option value="Somewhat Humid">Somewhat Humid</option>
                        <option value="Somewhat Dry">Somewhat Dry</option>
                        <option value="Very Dry">Very Dry</option>
                    </select>
                </div>
            </div>
        </div>
    </form>

    <!--DONT TOUCH THE BELOW CODE-->
    <script src="index.js"></script>
</body>
</html>
